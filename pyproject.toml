
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-data-engineering"
version = "0.1.0"
description = "A reproducible e-commerce database and analytics project using PostgreSQL, SQL, and Python."
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "SQLAlchemy",
    "psycopg[binary]",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
